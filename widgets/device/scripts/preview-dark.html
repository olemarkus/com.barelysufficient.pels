<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Device widget preview (dark)</title>
    <style>
      html, body { margin: 0; padding: 0; background: transparent; width: 1024px; height: 1024px; }
    </style>
  </head>
  <body>
    <svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="160%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
          <feOffset dx="0" dy="22" result="offsetblur"/>
          <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
          <feMerge>
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <g filter="url(#card-shadow)">
        <rect x="100" y="200" width="824" height="720" rx="44" ry="44" fill="#22282F"/>
      </g>

      <!-- Device name + status chip -->
      <rect x="150" y="258" width="300" height="34" rx="17" ry="17" fill="#5a6168"/>
      <rect x="704" y="256" width="170" height="40" rx="12" ry="12" fill="#f5a623" opacity="0.35"/>

      <!-- Lead figure (temperature / battery level) + its context -->
      <rect x="150" y="340" width="230" height="64" rx="18" ry="18" fill="#7fd1ae"/>
      <rect x="400" y="362" width="190" height="28" rx="14" ry="14" fill="#4a5158"/>
      <rect x="754" y="362" width="120" height="28" rx="14" ry="14" fill="#3a4148"/>

      <!-- Reason line -->
      <rect x="150" y="440" width="560" height="28" rx="14" ry="14" fill="#f5a623" opacity="0.55"/>

      <!-- Smart task block -->
      <rect x="150" y="510" width="724" height="190" rx="22" ry="22" fill="#2b3239"/>
      <rect x="182" y="542" width="380" height="30" rx="15" ry="15" fill="#5a6168"/>
      <rect x="704" y="538" width="138" height="38" rx="12" ry="12" fill="#58c56a" opacity="0.45"/>
      <rect x="182" y="600" width="260" height="24" rx="12" ry="12" fill="#4a5158"/>
      <rect x="182" y="644" width="220" height="24" rx="12" ry="12" fill="#3a4148"/>

      <!-- "+ Smart task" -->
      <rect x="664" y="770" width="210" height="64" rx="16" ry="16" fill="none" stroke="#5a6168" stroke-width="4"/>
      <rect x="696" y="790" width="146" height="24" rx="12" ry="12" fill="#5a6168"/>
    </svg>
  </body>
</html>

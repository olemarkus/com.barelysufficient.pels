name: NVE tariffs

# Weekly check that the grid tariff workarounds still match what NVE serves:
# a correction in lib/price/nveTariffCorrections.ts that no longer changes
# anything, a static fallback older than 60 days, or a grid company NVE no
# longer serves fails the run. See scripts/check-nve-tariffs.mjs.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nve-tariffs:
    name: nve-tariffs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain and dependencies
        uses: ./.github/actions/setup

      - name: Check NVE tariff corrections and fallback
        run: npm run check:nve-tariffs

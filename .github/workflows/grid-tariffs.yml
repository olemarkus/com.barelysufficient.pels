name: Grid tariffs

# Weekly check that PELS's grid tariff sources still cover the grid company
# list: the bundled Fri Nettleie table matches what Fri Nettleie publishes, every
# file parses with the runtime's parser, and every listed company gets a tariff.
# See scripts/check-grid-tariffs.mjs.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grid-tariffs:
    name: grid-tariffs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain and dependencies
        uses: ./.github/actions/setup

      - name: Check grid tariff sources
        run: npm run check:grid-tariffs
